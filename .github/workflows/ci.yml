name: Low Pressure Zone CI
on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          cache-dependency-path: ./src/low-pressure-zone-client/yarn.lock
          check-latest: true
      - run: yarn
        working-directory: ./src/low-pressure-zone-client
      - run: yarn lint
        working-directory: ./src/low-pressure-zone-client
      - run: yarn build --mode production
        working-directory: ./src/low-pressure-zone-client
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-build
          path: ./src/LowPressureZone.Api/wwwroot/
  
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Restore dependencies
        run: dotnet restore LowPressureZone.sln
        working-directory: ./src
      - name: Build
        run: dotnet build LowPressureZone.sln --no-restore -c Release
        working-directory: ./src
        
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Test Server
        run: dotnet test LowPressureZone.sln
        working-directory: ./src
  
