name: Low Pressure Zone CI
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript
            build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download .NET Install script
        run: wget https://dot.net/v1/dotnet-install.sh
      - name: Install .NET 11.0.x
        run: bash ./dotnet-install.sh -Channel 11.0 -Quality preview
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          cache-dependency-path: ./src/low-pressure-zone-client/yarn.lock
          check-latest: true
      - run: yarn
        working-directory: ./src/low-pressure-zone-client
      - run: yarn lint
        working-directory: ./src/low-pressure-zone-client
      - run: yarn build --mode production
        working-directory: ./src/low-pressure-zone-client
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-build
          path: ./src/LowPressureZone.Api/wwwroot/
  
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Restore dependencies
        run: dotnet restore LowPressureZone.sln
        working-directory: ./src
      - name: Build
        run: dotnet build LowPressureZone.sln --no-restore -c Release
        working-directory: ./src
        
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: build-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Run integration tests
        run: dotnet test LowPressureZone.sln
        working-directory: ./src
